  <text class="field" x="482" y="344">image_path</text>
  <text class="field" x="482" y="382">status, error</text>
  <text class="field" x="482" y="420">raw_output</text>
  <text class="field" x="482" y="458">kv_pairs_json</text>
  <text class="field" x="482" y="496">created_at / updated_at</text>

  <rect class="table" x="875" y="105" width="335" height="445" rx="14"/>
  <rect class="h3" x="875" y="105" width="335" height="58" rx="14"/>
