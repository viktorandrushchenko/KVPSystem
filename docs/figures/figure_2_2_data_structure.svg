<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,sans-serif;fill:#0f172a}
      .table{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.h1{fill:#2563eb}.h2{fill:#059669}.h3{fill:#ea580c}.h4{fill:#7c3aed}.h5{fill:#0f766e}
      .head{font:700 22px Arial,sans-serif;fill:#fff}.field{font:400 17px Arial,sans-serif;fill:#1f2937}
      .pk{font:700 17px Arial,sans-serif;fill:#0f172a}.fk{font:700 17px Arial,sans-serif;fill:#2563eb}
      .note{font:400 14px Arial,sans-serif;fill:#64748b}.line{stroke:#e2e8f0;stroke-width:1}.rel{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
