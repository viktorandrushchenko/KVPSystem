  <text class="field" x="82" y="364">size_bytes</text>
  <text class="field" x="82" y="402">status, error</text>
  <text class="field" x="82" y="440">created_at</text>
  <text class="field" x="82" y="478">updated_at</text>

  <rect class="table" x="455" y="105" width="335" height="445" rx="14"/>
