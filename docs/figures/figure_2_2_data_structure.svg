  <line class="line" x1="875" y1="200" x2="1210" y2="200"/>
  <text class="pk" x="902" y="191">PK id</text>
  <text class="fk" x="902" y="230">FK page_id</text>
  <text class="field" x="902" y="268">query_key</text>
  <text class="field" x="902" y="306">value_text</text>
  <text class="field" x="902" y="344">bbox_json</text>
  <text class="field" x="902" y="382">ref_text</text>
  <text class="field" x="902" y="420">confidence</text>
  <text class="field" x="902" y="458">raw_output</text>
  <text class="field" x="902" y="496">status / created_at / updated_at</text>

