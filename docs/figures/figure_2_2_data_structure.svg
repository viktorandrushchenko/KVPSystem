  <text class="fk" x="902" y="730">FK annotation_set_id</text>
  <text class="fk" x="902" y="768">FK page_id</text>
  <text class="field" x="902" y="806">query_key, value_text</text>
  <text class="field" x="902" y="844">bbox_json, created_at, updated_at</text>

  <rect class="table" x="1295" y="610" width="250" height="170" rx="14"/>
  <rect class="h1" x="1295" y="610" width="250" height="58" rx="14"/>
  <text class="head" x="1420" y="647" text-anchor="middle">JSON-файлы</text>
  <text class="field" x="1320" y="710">checkpoint_names.json</text>
  <text class="field" x="1320" y="748">annotation_exports/*.jsonl</text>

  <path class="rel" d="M365 330 C395 330 420 330 445 330"/>
  <path class="rel" d="M790 330 C820 330 845 330 865 330"/>
  <path class="rel" d="M790 735 C820 735 845 735 865 735"/>
